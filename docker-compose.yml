services:
  backend:
    container_name: farmacykart-backend
    image: farmacykart-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/public/logo:/app/public/logo
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - farmacykart-network

  frontend:
    container_name: farmacykart-frontend
    image: farmacykart-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.farmacykart.com/api}
        NEXT_PUBLIC_STORE_DOMAIN: ${NEXT_PUBLIC_STORE_DOMAIN:-https://farmacykart.com}
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    environment:
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://farmacykart.com}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - farmacykart-network

  admin:
    container_name: farmacykart-admin
    image: farmacykart-admin:latest
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_APP_API_BASE_URL: ${VITE_APP_API_BASE_URL:-https://api.farmacykart.com/api}
        VITE_APP_STORE_DOMAIN: ${VITE_APP_STORE_DOMAIN:-https://farmacykart.com}
        VITE_APP_ADMIN_DOMAIN: ${VITE_APP_ADMIN_DOMAIN:-https://admin.farmacykart.com}
    restart: unless-stopped
    ports:
      - "4100:80"
    env_file:
      - ./admin/.env
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/healthz || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - farmacykart-network

networks:
  farmacykart-network:
    name: farmacykart-network
    driver: bridge
