services:
  backend:
    container_name: farmacykart-backend
    image: farmacykart-backend:latest
    restart: unless-stopped
    ports:
      - "5000:8092"
    env_file:
      - ./backend/.env
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8092/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - farmacykart-network

  frontend:
    container_name: farmacykart-frontend
    image: farmacykart-frontend:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    environment:
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - farmacykart-network

  admin:
    container_name: farmacykart-admin
    image: farmacykart-admin:latest
    restart: unless-stopped
    ports:
      - "4100:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/healthz || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - farmacykart-network

networks:
  farmacykart-network:
    name: farmacykart-network
    driver: bridge
